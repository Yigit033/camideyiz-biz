name: TypeScript and Expo dependency check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      # Lockfile generated after first networked clean install.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - name: Parse Windows APK build script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('scripts/build-android-windows.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'PowerShell syntax OK'
      - name: Live free-calendar endpoint smoke test (non-blocking)
        # Provider outages are observable without breaking unrelated code checks.
        continue-on-error: true
        run: node --experimental-strip-types scripts/calendar-live-smoke.mjs
      - name: Build secure Diyanet API service
        run: npm run build --workspace @camideyiz/api
      - run: cd apps/mobile && npx expo install --check
      - name: Native widget Android CNG prebuild smoke test
        run: cd apps/mobile && CI=1 EXPO_NO_TELEMETRY=1 npx expo prebuild --platform android --no-install --clean
      - name: Expo Android bundle smoke test
        run: cd apps/mobile && CI=1 EXPO_NO_TELEMETRY=1 npx expo export --platform android --output-dir ../../.expo-export-check
      - name: Metro startup smoke test
        run: node scripts/metro-smoke.mjs
